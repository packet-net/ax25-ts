name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    name: build + typecheck + test
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: typecheck examples
        run: npm run typecheck:examples

      - name: build
        run: npm run build

      - name: unit tests
        # `npm test` excludes tests/integration/** (those run in
        # m0lte/packet.net's interop job, where the docker stack lives).
        run: npm test

  parity:
    name: parity vs packet.net (drift guard)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The C# libraries in m0lte/packet.net are the reference runtime. This
      # job extracts the named-flag / preset / listener-surface inventories
      # from packet.net main and compares them to ours, failing on any gap
      # that is not a reviewed exception in scripts/parity-exceptions.json.
      # The mirror of this check runs in packet.net's interop.yml (against its
      # head + our main), so drift fails on whichever side introduces it.
      #
      # packet-net/packet.net is PUBLIC, so this clone needs no credentials and
      # this side is always armed. It used to point at the pre-split private
      # m0lte/packet.net behind a PACKETNET_READ_TOKEN secret, and when that
      # secret was absent the step WARNED AND SKIPPED — so the C#-vs-TS leg of
      # this guard quietly verified nothing while still reporting success. That
      # is the same failure shape packet.net hit on its own side
      # (packet-net/packet.net#677): a guard that looks armed while testing
      # nothing. No token, no skip path.
      - name: clone packet-net/packet.net (shallow, source only)
        run: |
          rm -rf "${RUNNER_TEMP}/packet.net"
          git clone --depth=1 --branch main --filter=blob:none --sparse \
            https://github.com/packet-net/packet.net.git "${RUNNER_TEMP}/packet.net"
          git -C "${RUNNER_TEMP}/packet.net" sparse-checkout set src/Packet.Core src/Packet.Ax25

      # The Rust leg of the 3-way mirror: pico-node (packet-net/pico-node) is
      # PUBLIC, so unlike the packet.net clone above this needs no token and is
      # always armed. We only need its parity contract — the manifest, the
      # vendored C# expected-inventory map, and the exceptions — so a blobless
      # sparse checkout of the parity artifacts is enough. If this clone fails
      # or the artifacts are absent the parity-check step's --rust leg exits
      # non-zero and fails the job (a true gate), matching the packet.net side.
      - name: clone packet-net/pico-node (shallow, parity artifacts)
        run: |
          rm -rf "${RUNNER_TEMP}/pico-node"
          git clone --depth=1 --branch main --filter=blob:none --sparse \
            "https://github.com/packet-net/pico-node.git" "${RUNNER_TEMP}/pico-node"
          # --no-cone: cone mode (the default since git 2.37) only accepts DIRECTORY
          # patterns and hard-fails on a file path ("fatal: 'parity-manifest.toml' is not
          # a directory"), which killed this step — and with it every CI run here — from
          # 2026-07-12. Two of the three paths we want are files, so ask for literal patterns.
          git -C "${RUNNER_TEMP}/pico-node" sparse-checkout set --no-cone parity-manifest.toml parity-exceptions.json parity

      - name: parity check
        run: |
          # No skip path: the clone above is unauthenticated against a public repo, so
          # a missing checkout is a real failure, not a reason to pass quietly.
          if [ ! -d "${RUNNER_TEMP}/packet.net/src" ]; then
            echo "::error title=parity clone missing::packet.net was not cloned — the C#-vs-TS leg cannot run."
            exit 1
          fi
          # 3-way mirror: C# (packet.net) authoritative ⊆ TS (this repo) AND
          # ⊆ Rust (pico-node's declared coverage). Drift on any side fails here.
          node scripts/parity-check.mjs \
            --csharp "${RUNNER_TEMP}/packet.net" \
            --rust "${RUNNER_TEMP}/pico-node"
