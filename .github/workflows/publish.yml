name: publish

# Publishes `@packet-net/ax25` to npmjs.com on any tag matching `v*`.
# Version is taken from the tag (strip the leading `v`), so e.g.
# tagging `v0.2.1` publishes 0.2.1.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # Manual trigger lets you validate the workflow shape from a branch
    # NOTE that npm now publishes via trusted publishing, which has no secret
    # to leave unset, so a dispatch run WILL attempt a real npm upload. What
    # follows describes the old token guard
    # on the publish step will skip the upload if the secret is unset.
    inputs:
      override_version:
        description: 'Override version (only used for workflow_dispatch; tag wins for push events)'
        required: false
        default: ''

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-version:
    name: resolve version from tag
    runs-on: [self-hosted, Linux, X64]
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # github.ref is refs/tags/v0.2.1 — strip prefix + leading v.
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          else
            version="${{ inputs.override_version }}"
          fi
          if [ -z "$version" ]; then
            echo "::error::No version resolved (tag was '${GITHUB_REF}', input was empty)."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${version}"

  publish-npm:
    name: publish @packet-net/ax25 to npmjs.com
    needs: resolve-version
    # DELIBERATE EXCEPTION to the self-hosted-only rule, and the only one here.
    # npm REFUSES a provenance attestation built anywhere else: "Unsupported
    # GitHub Actions runner environment: self-hosted. Only github-hosted runners
    # are supported when publishing with provenance" (E422 on PUT). Trusted
    # publishing generates provenance by default, so the choice is a hosted
    # runner or no attestation. Same call as packet-net/ax25sdl#84. Every other
    # job here stays on [self-hosted, Linux, X64]; this one runs on release tags
    # only and is a install/build/publish, so it costs almost no minutes.
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC), configured at the npmjs end against
    # packet-net/ax25-ts + this workflow file, so the runner mints a short-lived
    # id-token per run and there is no long-lived NPM_TOKEN left to expire.
    # `id-token: write` is what permits that, and what lets npm attach the
    # provenance attestation.
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: ensure an npm that speaks trusted publishing
        # Trusted publishing needs npm >= 11.5.1. Pin the CLI forward rather
        # than inheriting whatever the node image happens to bundle.
        run: |
          npm install -g npm@latest
          npm --version

      - name: pin version from tag
        run: |
          echo "Pinning package.json → ${VERSION}"
          npm pkg set "version=${VERSION}"

      - name: install + build
        run: |
          npm ci
          npm run build

      - name: pack (dry-run sanity check)
        run: npm pack --dry-run

      - name: publish
        run: npm publish --access public
